[tool.ruff]
target-version = "py310"
line-length = 110
cache-dir = "build/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["ytdlp_studio"]
branch = true
data_file = "build/coverage/.coverage"

[tool.coverage.html]
directory = "build/coverage/html"

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.report]
show_missing = true
skip_covered = true
