name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $staging = Join-Path $env:RUNNER_TEMP "yt-dlp-studio-$version"
          $archive = Join-Path $env:RUNNER_TEMP "yt-dlp-studio-$version.zip"
          New-Item -ItemType Directory -Path $staging | Out-Null

          $exclude = @(
            ".git",
            ".github",
            ".venv",
            "__pycache__",
            "build",
            "dist"
          )

          Get-ChildItem -Force | Where-Object {
            $exclude -notcontains $_.Name
          } | Copy-Item -Destination $staging -Recurse -Force

          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ARCHIVE" `
            --title "yt-dlp Studio ${{ github.ref_name }}" `
            --notes-file CHANGELOG.md
